# Tenka Ichi en el server casero: la web (app), el HTTPS (caddy) y el aviso de la IP de casa al DNS (ddns).
# Se arranca desde esta carpeta con:  docker compose up -d --build
name: tenka

services:
  app:
    build:
      context: ..
      dockerfile: servidor/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    volumes:
      # Los datos locales de la web (data/ en la raíz del repo, fuera de git)
      - ../data:/app/data
    ports:
      # Solo para la red de casa (OBS, puente, realizador): el router NO debe abrir este puerto
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/salud"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    logging: *logs

  ddns:
    image: qmcgaw/ddns-updater:2
    restart: unless-stopped
    environment:
      PERIOD: 5m
      LOG_LEVEL: info
      TZ: Europe/Madrid
    volumes:
      - ./ddns:/updater/data
    # Su panelito, solo en casa: http://IP-del-server:8000
    ports:
      - "8000:8000"
    logging: *logs

volumes:
  caddy_datos:
  caddy_config:
