<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cabecera · Gokudō</title>
<!-- Fuente de navegador de OBS (escena Cabecera): la cabecera de inicio del directo, unos 12 s, una sola vez.
     OBS la reinicia al activarla (restart_when_active), así que arranca al cargar; el relé cambia de escena a los 12 s.
       ?jornada=<texto>   la jornada del día, en una placa abajo (sin jornada no sale la placa).
     Lenguaje de la barrida de las repeticiones (herramientas/barrida): un paño de noche que cruza de lado a lado con una
     curva suave y el filo bermellón #E0303A con un halo corto. Guion:
       0,15–1,05 s  barrida: entra la noche (el callejón del kit, desenfocado; se acerca muy despacio hasta los 11 s)
       1,0–2,1 s    el sol cortado de neón (logo actual de Gokudō) aparece y su tubo se enciende con un par de fallos
       1,9–2,6 s    GOKUDŌ, letra a letra; 2,6 s la raya bermellón; 2,8 s LIGA DE FAMILIAS; 3,3 s 極道 a los lados
       4,1–5,0 s    la placa de la jornada entra con su propia barrida pequeña
       7,2 s        極道 parpadea una vez; desde ahí todo queda quieto (nada en bucle)
     Solo se anima transform y opacity. Las animaciones esperan a que estén las fuentes y las imágenes. -->
<style>
  @font-face { font-family: 'Dela Gothic One'; src: url('fuentes/DelaGothicOne-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Yuji Boku'; src: url('fuentes/YujiBoku-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Zen Kaku Gothic New'; src: url('fuentes/ZenKakuGothicNew-Bold.ttf') format('truetype'); font-weight: 700; }
  :root {
    --noche: #0C0D13; --placa: #15161F; --sumi-linea: #2A2B38; --washi: #E7DFD2; --ceniza: #8D8A99;
    --shu: #E0303A; --shu-claro: #FF4C56; --shu-neon: #FF5A63;
    --dela: 'Dela Gothic One', 'Zen Kaku Gothic New', sans-serif;
    --pincel: 'Yuji Boku', 'Yu Mincho', serif;
    --gothic: 'Zen Kaku Gothic New', 'Yu Gothic', 'Segoe UI', sans-serif;
    --curva: cubic-bezier(.76, 0, .24, 1);          /* la de la barrida: arranca y llega suave, rápida en medio */
    --sale: cubic-bezier(.2, .9, .25, 1.1);
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--noche); }
  body { font-synthesis: none; position: relative; }
  body:not(.listo) * { animation-play-state: paused !important; }

  /* Barrida grande: el paño mide 1920 + 60 px para que el filo salga del todo por la derecha */
  .pano { position: absolute; left: 0; top: 0; width: 1980px; height: 1080px; overflow: hidden;
    transform: translateX(-1980px); animation: barre .9s var(--curva) .15s both; will-change: transform; }
  .pano-dentro { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform: translateX(1980px); animation: contra .9s var(--curva) .15s both; will-change: transform; }
  .filo { position: absolute; right: 0; top: 0; width: 3px; height: 1080px; background: var(--shu);
    box-shadow: 0 0 0 0 transparent, -6px 0 16px rgba(224, 48, 58, .45), 2px 0 4px rgba(224, 48, 58, .35); }
  .filo::after { content: ''; position: absolute; left: 1px; top: 0; width: 1px; height: 100%; background: var(--shu-neon); }
  .fondo { position: absolute; inset: 0; background: url('fondos/noche.jpg') 0 0 / 1920px 1080px no-repeat;
    transform: scale(1.08); animation: acerca 11s cubic-bezier(.25, .1, .25, 1) both; will-change: transform; }
  .velo { position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 46%, rgba(12, 13, 19, .45), rgba(12, 13, 19, .93) 72%),
                linear-gradient(0deg, rgba(12, 13, 19, .7), transparent 35%); }

  /* Lockup: sol + GOKUDŌ / raya / LIGA DE FAMILIAS */
  .lockup { position: absolute; left: 0; right: 0; top: 270px; height: 400px; display: flex; justify-content: center; align-items: center; gap: 96px; }
  .sol { position: relative; width: 380px; height: 380px; flex: none;
    animation: sol .7s var(--sale) 1s both; }
  .sol img { position: absolute; left: -170px; top: -170px; width: 720px; height: 720px;
    animation: tubo 1.1s steps(1, end) 1s both; }
  .nombre { display: flex; flex-direction: column; align-items: flex-start; }
  .gokudo { display: flex; font-family: var(--dela); font-weight: 400; font-size: 150px; line-height: 1; letter-spacing: .01em; color: var(--washi);
    text-shadow: 0 4px 0 rgba(0, 0, 0, .5), 0 0 30px rgba(224, 48, 58, .28); }
  .gokudo i { display: inline-block; font-style: normal;
    animation: letra .5s var(--sale) calc(1.9s + var(--k) * .07s) both; }
  .regla { width: 150px; height: 5px; margin: 30px 0 24px 6px; border-radius: 2px; background: var(--shu-claro);
    box-shadow: 0 0 10px var(--shu), 0 0 26px rgba(224, 48, 58, .6); transform-origin: 0 50%;
    animation: regla .5s var(--curva) 2.6s both; }
  .liga { margin-left: 8px; font-family: var(--gothic); font-weight: 700; font-size: 32px; letter-spacing: .52em; color: var(--washi); opacity: .82;
    animation: liga .6s ease-out 2.8s both; }

  /* 極道 a los dos lados, como en las pantallas del kit */
  .kanji { position: absolute; top: 120px; font-family: var(--pincel); font-size: 96px; line-height: 1.02; writing-mode: vertical-rl; text-orientation: upright;
    color: var(--shu-neon); text-shadow: 0 0 6px var(--shu-claro), 0 0 20px var(--shu), 0 0 44px rgba(224, 48, 58, .7);
    animation: estampa .5s cubic-bezier(.2, .9, .3, 1.35) 3.3s both, chispa .5s steps(1, end) 7.2s; }
  .kanji.izq { left: 112px; }
  .kanji.der { right: 112px; animation-delay: 3.45s, 7.3s; }

  /* Placa de la jornada: entra con una barrida pequeña (mismo truco: lo de dentro va al revés y se queda quieto) */
  .jornada { position: absolute; left: 0; right: 0; top: 790px; display: flex; justify-content: center; }
  .jornada[hidden] { display: none; }
  .revela { position: relative; overflow: hidden; border-radius: 8px; }
  .revela-mov { position: relative; overflow: hidden; border-radius: 8px; transform: translateX(-102%); animation: barre-placa .7s var(--curva) 4.1s both; }
  .revela-fijo { transform: translateX(102%); animation: contra-placa .7s var(--curva) 4.1s both; }
  .revela-mov .filo-placa { position: absolute; right: 0; top: 0; bottom: 0; width: 3px; background: var(--shu);
    box-shadow: -5px 0 12px rgba(224, 48, 58, .55); animation: apaga .35s ease-out 4.8s both; }
  .placa { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 46px 20px; border-radius: 8px;
    background: linear-gradient(180deg, rgba(21, 22, 31, .97), rgba(12, 13, 19, .97)); border: 1px solid var(--sumi-linea);
    box-shadow: inset 0 0 0 1px rgba(224, 48, 58, .18), 0 18px 50px rgba(0, 0, 0, .55); }
  .placa small { font-family: var(--gothic); font-weight: 700; font-size: 15px; letter-spacing: .38em; margin-right: -.38em; text-transform: uppercase;
    color: var(--shu-neon); text-shadow: 0 0 10px var(--shu); animation: aparece .4s ease-out 4.6s both; }
  .placa b { font-family: var(--dela); font-weight: 400; font-size: 44px; line-height: 1.05; letter-spacing: .03em; color: var(--washi); white-space: nowrap;
    animation: aparece .4s ease-out 4.7s both; }

  @keyframes barre { from { transform: translateX(-1980px); } to { transform: none; } }
  @keyframes contra { from { transform: translateX(1980px); } to { transform: none; } }
  @keyframes barre-placa { from { transform: translateX(-102%); } to { transform: none; } }
  @keyframes contra-placa { from { transform: translateX(102%); } to { transform: none; } }
  @keyframes acerca { from { transform: scale(1.08); } to { transform: none; } }
  @keyframes sol { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
  /* Un tubo que arranca: falla un par de veces y se queda encendido */
  @keyframes tubo { 0% { opacity: 0; } 10% { opacity: 1; } 19% { opacity: .2; } 30% { opacity: 1; } 39% { opacity: .45; } 52%, 100% { opacity: 1; } }
  @keyframes letra { from { opacity: 0; transform: translateY(46px); } to { opacity: 1; transform: none; } }
  @keyframes regla { from { transform: scaleX(0); } to { transform: none; } }
  @keyframes liga { from { opacity: 0; transform: translateX(-18px); } to { opacity: .82; transform: none; } }
  @keyframes estampa { from { opacity: 0; transform: scale(1.6); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }
  @keyframes chispa { 0%, 100% { opacity: 1; } 20% { opacity: .3; } 40% { opacity: 1; } 60% { opacity: .55; } }
  @keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
  @keyframes apaga { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>
  <div class="pano">
    <div class="pano-dentro">
      <div class="fondo"></div>
      <div class="velo"></div>
      <span class="kanji izq" aria-hidden="true">極道</span>
      <span class="kanji der" aria-hidden="true">極道</span>
      <div class="lockup">
        <div class="sol"><img src="fondos/sol-neon.png" alt=""></div>
        <div class="nombre">
          <b class="gokudo" aria-label="GOKUDŌ">GOKUDŌ</b>
          <i class="regla"></i>
          <span class="liga">LIGA DE FAMILIAS</span>
        </div>
      </div>
      <div class="jornada" id="jornada" hidden>
        <div class="revela"><div class="revela-mov"><div class="revela-fijo">
          <div class="placa"><small>Hoy en directo</small><b id="jornada-texto"></b></div>
        </div><i class="filo-placa"></i></div></div>
      </div>
    </div>
    <i class="filo"></i>
  </div>
  <script>
    const jornada = (new URLSearchParams(location.search).get('jornada') || '').trim().slice(0, 48);
    if (jornada) { document.getElementById('jornada-texto').textContent = jornada; document.getElementById('jornada').hidden = false; }
    // GOKUDŌ en una <i> por letra, con --k de 0 a 5 para escalonarlas
    const g = document.querySelector('.gokudo');
    g.replaceChildren(...[...g.textContent].map((l, k) => {
      const i = document.createElement('i');
      i.textContent = l;
      i.style.setProperty('--k', k);
      i.setAttribute('aria-hidden', 'true');
      return i;
    }));
    // Arranca cuando están las fuentes y las imágenes (como mucho, 1,5 s después de cargar)
    const listo = () => document.body.classList.add('listo');
    Promise.race([
      Promise.all([document.fonts.ready, new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r)))]),
      new Promise(r => setTimeout(r, 1500)),
    ]).then(listo, listo);
  </script>
</body>
</html>
