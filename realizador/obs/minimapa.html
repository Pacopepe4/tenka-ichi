<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marco del minimapa · Gokudō</title>
<!-- Fuente de navegador LOCAL de OBS (escena Juego), 1920×1080 y fondo transparente: el marco del minimapa del LoL con el
     estilo Gokudō. Solo pinta POR FUERA del hueco del minimapa: el mapa queda limpio.
     Va en obs/ del realizador, junto a obs/fuentes/ (Dela Gothic One, Zen Kaku Gothic New Bold y Yuji Boku recortada a
     再極道). Sin internet y sin imágenes.

     Dónde está el hueco (en píxeles del lienzo 1920×1080; el minimapa del LoL va abajo a la derecha y su tamaño depende
     del MinimapScale del juego):
       ?lado=280            lado del minimapa (cuadrado). O bien ?ancho= y ?alto= si no fuera cuadrado
       ?x=1630&y=790        esquina de arriba a la izquierda del hueco. Por defecto: pegado abajo a la derecha con ?margen
       ?margen=10           separación con los bordes de la pantalla cuando no se da x o y
     Aspecto:
       ?grosor=10           grosor del marco de noche alrededor del hueco
       ?rotulo=0            sin la pestaña 極道 de arriba
       ?guia=1              para calibrar: el hueco rayado con su medida y su posición (quitarlo en directo) -->
<style>
  @font-face { font-family: 'Dela Gothic One'; src: url('fuentes/DelaGothicOne-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'Zen Kaku Gothic New'; font-weight: 700; src: url('fuentes/ZenKakuGothicNew-Bold.ttf') format('truetype'); }
  @font-face { font-family: 'Yuji Boku'; src: url('fuentes/YujiBoku-Regular.ttf') format('truetype'); }
  :root {
    --noche: #0C0D13; --placa: #15161F; --filo: #2A2B38; --shu: #E0303A; --shu-claro: #FF4C56; --neon: #FF5A63; --washi: #E7DFD2; --hai: #8D8A99;
    /* Los pone el script con lo que diga la dirección */
    --x: 1630px; --y: 790px; --ancho: 280px; --alto: 280px; --grosor: 10px;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }

  /* El marco: una placa de noche alrededor del hueco. Solo se pinta el borde, así que el hueco del mapa queda vacío */
  .marco { position: absolute; left: calc(var(--x) - var(--grosor)); top: calc(var(--y) - var(--grosor));
    width: calc(var(--ancho) + 2 * var(--grosor)); height: calc(var(--alto) + 2 * var(--grosor)); box-sizing: border-box;
    border: var(--grosor) solid var(--placa); border-radius: 8px;
    box-shadow: 0 0 0 1px var(--filo), 0 0 0 3px rgba(0, 0, 0, .55), -6px -6px 28px rgba(0, 0, 0, .5); }
  /* El tubo de neón bermellón, justo por fuera del hueco: su halo cae sobre la placa, nunca sobre el mapa */
  .tubo { position: absolute; left: var(--x); top: var(--y); width: var(--ancho); height: var(--alto); pointer-events: none;
    box-shadow: 0 0 0 2px var(--shu-claro), 0 0 10px 2px rgba(224, 48, 58, .7), 0 0 22px 4px rgba(190, 42, 47, .45); }
  .tubo.enciende { animation: encender 1.1s steps(1, end) both, zumbido 6s ease-in-out 2s infinite; }

  /* La pestaña de arriba: 極道 a pincel en neón sobre una placa de noche, pegada al marco */
  .rotulo { position: absolute; left: calc(var(--x) - var(--grosor)); top: calc(var(--y) - var(--grosor) - 34px); height: 34px; box-sizing: border-box;
    display: flex; align-items: center; gap: 8px; padding: 0 12px 2px 10px; background: var(--placa); border-radius: 8px 8px 0 0;
    box-shadow: 0 0 0 1px var(--filo); }
  .rotulo b { font-family: 'Yuji Boku', serif; font-weight: 400; font-size: 22px; line-height: 1; color: var(--neon);
    text-shadow: 0 0 4px var(--shu-claro), 0 0 12px var(--shu); }
  .rotulo span { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .26em; color: var(--hai); }
  .rotulo[hidden] { display: none; }

  /* Guía para calibrar en OBS */
  .guia { position: absolute; left: var(--x); top: var(--y); width: var(--ancho); height: var(--alto); display: none; place-items: center;
    background: repeating-linear-gradient(45deg, rgba(231, 223, 210, .18) 0 12px, transparent 12px 24px); outline: 1px dashed rgba(231, 223, 210, .8); }
  body.con-guia .guia { display: grid; }
  .guia span { padding: 6px 10px; border-radius: 6px; background: rgba(12, 13, 19, .85); color: var(--washi); text-align: center;
    font: 700 15px/1.4 'Zen Kaku Gothic New', 'Segoe UI', sans-serif; }

  @keyframes encender { 0% { opacity: 0; } 15% { opacity: 1; } 25% { opacity: .2; } 40% { opacity: 1; } 48% { opacity: .3; } 60%, 100% { opacity: 1; } }
  @keyframes zumbido { 0%, 100%, 47%, 53% { opacity: 1; } 50% { opacity: .82; } }
</style>
</head>
<body>
  <div class="marco"></div>
  <div class="tubo enciende"></div>
  <div class="rotulo"><b>極道</b><span>MAPA</span></div>
  <div class="guia"><span></span></div>
<script>
  // Medidas desde la dirección; lo que no venga o no sea un número, a los valores por defecto
  const p = new URLSearchParams(location.search);
  const num = (k, defecto, min, max) => { const v = Number(p.get(k)); return p.has(k) && Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : defecto; };
  const lado = num('lado', 280, 80, 900);
  const ancho = num('ancho', lado, 80, 900), alto = num('alto', lado, 80, 900);
  const margen = num('margen', 10, 0, 300), grosor = num('grosor', 10, 0, 40);
  const x = num('x', 1920 - margen - ancho, 0, 1920), y = num('y', 1080 - margen - alto, 0, 1080);
  const raiz = document.documentElement.style;
  raiz.setProperty('--x', `${x}px`); raiz.setProperty('--y', `${y}px`);
  raiz.setProperty('--ancho', `${ancho}px`); raiz.setProperty('--alto', `${alto}px`); raiz.setProperty('--grosor', `${grosor}px`);
  document.querySelector('.rotulo').hidden = p.get('rotulo') === '0';
  if (p.get('guia') === '1') {
    document.body.classList.add('con-guia');
    document.querySelector('.guia span').innerHTML = `Minimapa<br>${ancho}×${alto} en x ${x}, y ${y}`;
  }
  // OBS reinicia la fuente al enseñarla; si no, el tubo vuelve a encenderse cada vez que la escena se ve
  window.addEventListener('obsSourceVisibleChanged', e => {
    if (!e.detail?.visible) return;
    const t = document.querySelector('.tubo');
    t.classList.remove('enciende'); void t.offsetWidth; t.classList.add('enciende');
  });
</script>
</body>
</html>
