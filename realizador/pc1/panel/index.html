<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realizador · Panel</title>
<style>
  :root {
    --fondo: #111214; --caja: #1a1c1f; --borde: #2b2e33; --texto: #e8e6e1; --suave: #8f9399;
    --azul: #4c8dff; --rojo: #ff5a4f; --ok: #3ccf7a; --aviso: #f2b33d; --mal: #ff5a4f; --acento: #e8c46a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--borde); }
  h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .04em; text-transform: uppercase; }
  .conex { display: flex; flex-wrap: wrap; gap: 12px; color: var(--suave); font-size: 13px; }
  .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--suave); }
  .punto.si { background: var(--ok); } .punto.no { background: var(--mal); }
  .relojes { margin-left: auto; display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
  .reloj b { display: block; font-size: 20px; }
  .reloj span { color: var(--suave); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .relojes { margin-left: 0; } }
  section { background: var(--caja); border: 1px solid var(--borde); border-radius: 8px; padding: 14px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); margin: 0 0 10px; }
  .antena { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .antena .que { font-size: 22px; font-weight: 600; }
  .antena .detalle { color: var(--suave); }
  button { font: inherit; color: var(--texto); background: #24272b; border: 1px solid var(--borde); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  button:hover { border-color: var(--suave); }
  button.grande { padding: 12px 18px; font-weight: 600; }
  button.manual { background: var(--mal); border-color: var(--mal); color: #fff; }
  .jugadores { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  .jugadores button { text-align: left; }
  .jugadores button.azul { border-left: 3px solid var(--azul); } .jugadores button.rojo { border-left: 3px solid var(--rojo); }
  .jugadores button small { color: var(--suave); display: block; }
  ol, ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 0; border-top: 1px solid var(--borde); display: flex; gap: 10px; align-items: baseline; }
  li:first-child { border-top: 0; }
  .t { font-variant-numeric: tabular-nums; color: var(--suave); min-width: 56px; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--borde); color: var(--suave); white-space: nowrap; }
  .chip.en-curso { color: #111; background: var(--acento); border-color: var(--acento); }
  .chip.guion { color: var(--texto); border-color: var(--suave); }
  .chip.emitidos { color: var(--ok); border-color: var(--ok); }
  .chip.descartadas { text-decoration: line-through; }
  .avisos li { color: var(--aviso); }
  .vacio { color: var(--suave); }
  .col { display: grid; gap: 16px; align-content: start; }
  .registro { max-height: 320px; overflow: auto; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Realizador</h1>
  <div class="conex" id="conex"></div>
  <div class="relojes">
    <div class="reloj"><span>Directo (PC 1)</span><b id="tDirecto">--:--</b></div>
    <div class="reloj"><span>Antena (PC 2)</span><b id="tAntena">--:--</b></div>
    <div class="reloj"><span>Margen</span><b id="margen">--</b></div>
  </div>
</header>
<main>
  <div class="col">
    <section>
      <h2>En antena</h2>
      <div class="antena">
        <div><div class="que" id="que">Esperando partida</div><div class="detalle" id="detalle"></div></div>
        <button class="grande" id="botonControl">Tomar el control</button>
      </div>
      <div class="jugadores" id="jugadores"></div>
      <div style="margin-top:8px"><button id="general">Plano general</button></div>
    </section>
    <section>
      <h2>Próximos planos</h2>
      <ol id="proximos"></ol>
    </section>
    <section>
      <h2>Acciones programadas</h2>
      <ol id="acciones"></ol>
    </section>
  </div>
  <div class="col">
    <section class="avisos" id="cajaAvisos" hidden>
      <h2>Avisos</h2>
      <ul id="avisos"></ul>
    </section>
    <section>
      <h2>Jugadas</h2>
      <ol id="jugadas"></ol>
    </section>
    <section>
      <h2>Registro</h2>
      <ol class="registro" id="registro"></ol>
    </section>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reloj = t => t === null || t === undefined ? '--:--' : `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  const NOMBRES = { explorador: 'Explorador', liveEvents: 'LiveEvents', puente: 'Servidor del puente', rele: 'PC 2', obs: 'OBS', tenka: 'TENKA ICHI' };
  const TIPOS = { pelea: 'Pelea', objetivo: 'Objetivo', muerte: 'Muerte', estructura: 'Estructura' };
  const ESTADOS = { pendientes: 'pendiente', guion: 'en guion', 'en-curso': 'en antena', emitidos: 'emitida', descartadas: 'descartada' };
  let f = null;

  const plano = p => p.tipo === 'general' ? 'Plano general' : `Sigue a ${esc(p.objetivo?.campeon)} <span class="vacio">${esc(p.objetivo?.jugador)}</span>`;

  function pintar() {
    if (!f) return;
    $('conex').innerHTML = Object.entries(f.conexiones).filter(([k, v]) => v !== null && v !== undefined && k !== 'releIp')
      .map(([k, v]) => `<span><i class="punto ${v ? 'si' : 'no'}"></i>${NOMBRES[k] || k}</span>`).join('');
    $('tDirecto').textContent = reloj(f.tDirecto);
    $('tAntena').textContent = reloj(f.tAntena);
    $('margen').textContent = f.margenReal === null ? '--' : `${Math.round(f.margenReal)} s`;

    const p = f.planoActual;
    $('que').innerHTML = f.manual ? 'Control manual' : p ? plano(p) : (f.tAntena === null ? 'Esperando partida' : 'Sin plano');
    $('detalle').textContent = f.modoRele === 'degradado' ? 'El relé está en modo degradado: no le llegan órdenes'
      : p?.jugada ? `Jugada ${p.jugada}` : '';
    const b = $('botonControl');
    b.textContent = f.manual ? 'Devolver el control' : 'Tomar el control';
    b.classList.toggle('manual', f.manual);

    $('jugadores').innerHTML = (f.jugadores || []).map((j, i) =>
      `<button class="${esc(j.equipo)}" data-i="${i}">${esc(j.campeon)}<small>${esc(j.jugador)} · ${esc(j.posicion)}</small></button>`).join('');

    $('proximos').innerHTML = f.proximos.length ? f.proximos.map(x =>
      `<li><span class="t">${f.tAntena === null ? reloj(x.inicio) : '+' + Math.round(x.inicio - f.tAntena) + ' s'}</span><span>${plano(x)}</span></li>`).join('')
      : '<li class="vacio">Nada aún</li>';
    $('acciones').innerHTML = f.acciones.length ? f.acciones.map(a =>
      `<li><span class="t">${reloj(a.t)}</span><span>${a.tipo === 'repeticion' ? 'Repetición de ' + esc(a.jugada) : 'Línea por línea'} · ${a.segundos} s</span></li>`).join('')
      : '<li class="vacio">Ninguna</li>';
    $('jugadas').innerHTML = f.jugadas.length ? f.jugadas.map(j =>
      `<li><span class="t">${reloj(j.inicio)}</span><span>${TIPOS[j.tipo] || j.tipo}${j.muertes ? ' · ' + j.muertes + (j.muertes === 1 ? ' muerte' : ' muertes') : ''}${j.objetivos.length ? ' · ' + esc(j.objetivos.join(', ')) : ''}${j.repetir ? ' · repetir' : ''}
       <span class="vacio">${esc(j.campeones.join(', '))}</span></span><span class="chip ${j.estado}" style="margin-left:auto">${ESTADOS[j.estado] || j.estado}</span></li>`).join('')
      : '<li class="vacio">Sin jugadas</li>';
    $('registro').innerHTML = f.registro.map(r =>
      `<li><span class="t">${esc(r.hora.slice(11, 19))}</span><span>${esc(r.quien)} · ${esc(r.que)}${r.jugada ? ' ' + esc(r.jugada) : ''}${r.motivo ? ' (' + esc(r.motivo) + ')' : ''}</span></li>`).join('');
    $('cajaAvisos').hidden = !f.avisos.length;
    $('avisos').innerHTML = f.avisos.map(a => `<li>${esc(a.hora.slice(11, 19))} · ${esc(a.texto)}</li>`).join('');
  }

  async function mandar(ruta, cuerpo) {
    const r = await fetch(ruta, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
    const d = await r.json();
    if (!d.ok) alert(d.error || 'No se pudo');
  }

  $('botonControl').onclick = () => mandar('/control', { manual: !f?.manual });
  $('general').onclick = () => mandar('/orden', { tipo: 'general' });
  $('jugadores').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    const j = f.jugadores[Number(b.dataset.i)];
    mandar('/orden', { tipo: 'seguir', objetivo: { jugador: j.jugador, campeon: j.campeon, equipo: j.equipo } });
  };

  const fuente = new EventSource('/sse');
  fuente.onmessage = m => { f = JSON.parse(m.data); pintar(); };
</script>
</body>
</html>
