<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KBStats</title>

    

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/static/images/team_kaiju.png"
    />

    <!-- CSS global de tu proyecto -->
    <link rel="stylesheet" href="/static/css/kbstats.css" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS extra por página -->
    
<style>
  .kblix-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 1rem 2rem;
  }
  .kblix-title {
    font-size: 3.5rem;
    font-weight: 800;
    color: #58a6ff;
    letter-spacing: 6px;
    margin-bottom: 0.4rem;
  }
  .kblix-sub {
    color: #8b949e;
    font-size: 1.05rem;
    margin-bottom: 3rem;
  }
  .kblix-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 2.5rem;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .kblix-card input {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: #e6edf3;
    font-size: 1rem;
    width: 100%;
  }
  .kblix-card input:focus {
    outline: none;
    border-color: #58a6ff;
  }
  .kblix-card .btn-crear {
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    width: 100%;
    cursor: pointer;
    text-decoration: none;
    display: block;
    text-align: center;
    transition: opacity 0.2s;
  }
  .kblix-card .btn-crear:hover { opacity: 0.85; color: #fff; }
  .kblix-card .btn-unirse {
    background: #1f6feb;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    width: 100%;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .kblix-card .btn-unirse:hover { opacity: 0.85; }
  .kblix-divider { text-align: center; color: #8b949e; font-size: 0.85rem; }
</style>

  </head>

  <body class="wrapper">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center fs-3" href="/">KB Stats</a>
        <div class="d-flex gap-3 ms-auto align-items-center">
          <a class="nav-link text-secondary" href="/promedios_jugadores/?format=html" style="font-size:0.85rem;">Promedios</a>
          <a class="nav-link text-secondary" href="/tierlist/" style="font-size:0.85rem;">Tier List</a>
          <a class="nav-link text-secondary" href="/ladder/" style="font-size:0.85rem;">Ladder</a>
          
        </div>
      </div>
    </nav>

    <main class="container">
<div class="kblix-hero">
  <div class="kblix-title">KBLIX</div>
  <p class="kblix-sub">¿Quién jugó con quién?</p>

  <div class="kblix-card">
    <a href="/kblix/crear/" class="btn-crear">Crear nueva sala</a>

    <div class="kblix-divider">— o únete con un código —</div>

    <form id="join-form" style="display:flex; flex-direction:column; gap:0.75rem;">
      <input type="text" id="room-input" placeholder="Código de sala (ej: AB12CD)"
             maxlength="6" style="text-transform:uppercase;" autocomplete="off">
      <button type="submit" class="btn-unirse">Unirse</button>
    </form>
  </div>
</div>

<script>
  document.getElementById('join-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const code = document.getElementById('room-input').value.trim().toUpperCase();
    if (code.length === 6) {
      window.location.href = `/kblix/sala/${code}/`;
    }
  });
</script>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
