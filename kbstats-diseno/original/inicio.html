<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KBStats</title>

    

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/static/images/team_kaiju.png"
    />

    <!-- CSS global de tu proyecto -->
    <link rel="stylesheet" href="/static/css/kbstats.css" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS extra por página -->
    
  </head>

  <body class="wrapper">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center fs-3" href="/">KB Stats</a>
        <div class="d-flex gap-3 ms-auto align-items-center">
          <a class="nav-link text-secondary" href="/promedios_jugadores/?format=html" style="font-size:0.85rem;">Promedios</a>
          <a class="nav-link text-secondary" href="/tierlist/" style="font-size:0.85rem;">Tier List</a>
          <a class="nav-link text-secondary" href="/ladder/" style="font-size:0.85rem;">Ladder</a>
          
        </div>
      </div>
    </nav>

    <main class="container">
<div class="container py-5">
  <div class="text-center mb-5">
    <h1 class="fw-bold display-4 text-gradient">KBStats</h1>
    <p class="lead">Panel general — resumen del sistema</p>
  </div>

  <div class="row g-4 justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-lg border-0 stat-card">
        <div class="card-body text-center p-4">
          <h5 class="text-uppercase text-secondary mb-2">Total Partidas</h5>
          <h2 class="fw-bold display-5">44</h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-lg border-0 stat-card">
        <div class="card-body text-center p-4">
          <h5 class="text-uppercase text-secondary mb-2">Jugadores Únicos</h5>
          <h2 class="fw-bold display-5">107</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="text-center mt-5">
    <a
      class="btn btn-warning btn-lg px-4 me-3"
      href="/clasificacion/"
    >
      Ver clasificación
    </a>

    <a
      class="btn btn-primary btn-lg px-4 me-3"
      href="/buscar_partidos/?format=html"
    >
      Buscar partidas por jornada
    </a>

    <a
      class="btn btn-outline-secondary btn-lg px-4 me-3"
      href="/promedios_jugadores/?format=html"
    >
      Promedios por jugador
    </a>

    <a
      class="btn btn-outline-info btn-lg px-4 me-3"
      href="/tierlist/"
    >
      Tier List
    </a>

    <a
      class="btn btn-lg px-4"
      href="/kblix/"
      style="
        background: #1f6feb;
        color: #fff;
        font-weight: 700;
        letter-spacing: 2px;
      "
    >
      KBLIX
    </a>

    <a
      class="btn btn-lg px-5 mt-3 d-block mx-auto"
      href="/ladder/"
      style="
        background: linear-gradient(90deg, #22d3ee, #6366f1);
        color: #fff;
        font-weight: 800;
        font-size: 1.3rem;
        letter-spacing: 3px;
        border: none;
        border-radius: 0.6rem;
        box-shadow:
          0 0 24px rgba(34, 211, 238, 0.35),
          0 0 48px rgba(99, 102, 241, 0.2);
        max-width: 320px;
      "
    >
      🏆 LADDER
    </a>

    
  </div>
</div>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
