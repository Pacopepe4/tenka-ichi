# Despliegue en Render (plan gratuito). En Render: New → Blueprint → elige este repositorio.
services:
  - type: web
    name: tenka-ichi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: PANEL_CLAVE
        sync: false        # Render te la pedirá al crear el servicio
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_CREDENTIALS
        sync: false
      # Gachapon: inicio de sesión con Discord (app gratis en discord.com/developers)
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SESION_SECRETO
        sync: false
      # Publicar colección, alineación y tier list en un canal (webhook del canal)
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_WEBHOOK_ALINEACION   # opcional: la alineación en otro canal
        sync: false
      - key: DISCORD_WEBHOOK_TIERLIST   # opcional: la tier list en otro canal
        sync: false
      - key: DISCORD_WEBHOOK_CLASIFICACION   # opcional: la clasificación del fantasy en otro canal
        sync: false
      # Comandos del bot en el servidor de Discord (/reclutar): Public Key de la app y token del bot
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      # Opcional: puntos del canal de Twitch (app gratis en dev.twitch.tv)
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      # Opcional: puntos del canal de Kick, la recompensa «Omamori» (app gratis en kick.com/settings/developer)
      - key: KICK_CLIENT_ID
        sync: false
      - key: KICK_CLIENT_SECRET
        sync: false
      # El aviso de «empieza el directo en Kick», en #avisos-directo (lo crea npm run discord-aplicar; si no, va al de DISCORD_WEBHOOK_URL)
      - key: DISCORD_WEBHOOK_DIRECTO
        sync: false
      # Crónicas de las partidas: la clave con la que las manda el realizador y el webhook del canal #resultados
      # (lo crea npm run discord-aplicar)
      - key: CRONICAS_CLAVE
        sync: false
      - key: DISCORD_WEBHOOK_RESULTADOS
        sync: false
