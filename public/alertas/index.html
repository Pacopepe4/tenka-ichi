<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Alertas de Kick · Gokudō</title>
<link rel="icon" href="/marca/gokudo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yuji+Boku&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="alertas.css">
</head>
<body>
<!-- Fuente de navegador de OBS (1920×1080, fondo transparente): alertas de Kick con el estilo Gokudō, una detrás de otra.
     Llegan por el WebSocket de la web (/ws?canal=alertas) cuando Kick avisa de un seguidor, una sub, una renovación,
     subs regaladas o kicks (server/kick-bot.js). Para colocarla sin esperar a nadie: «Probar alerta» en el panel,
     o abrir /alertas/?prueba que las enseña todas en bucle -->
<div id="escena" aria-live="polite"></div>

<template id="plantilla">
  <article class="alerta">
    <div class="rotulo">
      <span class="kanji" aria-hidden="true"></span>
      <div class="texto">
        <p class="etiqueta"></p>
        <p class="nombre"></p>
        <p class="detalle"></p>
        <p class="mensaje" hidden></p>
      </div>
      <img class="sol" src="/marca/gokudo-neon.png" alt="">
    </div>
    <p class="sobres" hidden></p>
  </article>
</template>
<script type="module" src="alertas.js"></script>
</body>
</html>
