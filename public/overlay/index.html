<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Overlay de draft · Tenka Ichi</title>
<link rel="stylesheet" href="/marca.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="lienzo">
  <!-- Fondo de tinta con los huecos de las cámaras recortados -->
  <div class="fondo"></div>

  <header class="placa azul">
    <span class="kanji-fondo" aria-hidden="true"></span>
    <img class="logo" alt="">
    <div class="equipo"><span class="nombre"></span><span class="lema"></span></div>
  </header>
  <div class="marcador">
    <div class="arriba"></div>
    <div class="grande"></div>
    <div class="abajo"></div>
  </div>
  <header class="placa rojo">
    <span class="kanji-fondo" aria-hidden="true"></span>
    <div class="equipo"><span class="nombre"></span><span class="lema"></span></div>
    <img class="logo" alt="">
  </header>
  <div class="hanko sello-tiempo" hidden></div>

  <div class="picks azul"></div>
  <div class="picks rojo"></div>

  <div class="escenario">
    <figure class="kakemono">
      <img src="/marca/sol-partido.jpg" alt="">
      <figcaption>El que reina bajo el cielo</figcaption>
    </figure>
    <div class="camaras"></div>
  </div>

  <div class="bans azul"></div>
  <div class="bans rojo"></div>

  <div class="franja">
    <div class="reposo">
      <div class="liga"><span class="hanko">天</span><span class="jornada"></span></div>
      <div class="fearless" hidden><span class="titulo">Bloqueados en la serie</span><div class="iconos"></div></div>
    </div>
    <div class="tarjeta" hidden></div>
  </div>
</div>
<script type="module" src="overlay.js"></script>
</body>
</html>
